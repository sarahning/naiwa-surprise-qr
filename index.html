<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9e9">
  <title>合成大奶蛙</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff9e9;
      color: #262018;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(100%, 480px);
      padding: 48px 28px;
      text-align: center;
      background: white;
      border: 3px solid #262018;
      border-radius: 28px;
      box-shadow: 10px 10px 0 #f1d657;
    }
    .frog {
      width: 148px;
      height: 148px;
      margin: 0 auto 28px;
      overflow: hidden;
      border-radius: 50%;
    }
    .frog img { width: 370px; max-width: none; height: auto; transform: translate(-1px, -7px); }
    h1 { margin: 0 0 28px; font-size: clamp(30px, 8vw, 44px); }
    p { margin: 0; font-size: clamp(24px, 6vw, 31px); font-weight: 700; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="frog"><img src="naiwa.png" alt="奶蛙"></div>
    <h1>合成大奶蛙</h1>
    <p>哈哈，你被骗了</p>
  </main>
</body>
</html>
